    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .table-container { max-height: 700px; overflow-y: auto; }
        
        /* Stili Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-block;
            min-width: 85px;
            text-align: center;
        }
        .badge-disponibile { background-color: #dcfce7 !important; color: #166534 !important; }
        .badge-prenotato { background-color: #fef9c3 !important; color: #854d0e !important; }
        .badge-venduto { background-color: #fee2e2 !important; color: #991b1b !important; }

        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        @media (min-width: 768px) {
            .btn-action { width: 32px; height: 32px; }
        }
        .btn-action:hover { transform: scale(1.1); }
        .btn-check { background-color: #22c55e; color: white; }
        .btn-clock { background-color: #eab308; color: white; }
        .btn-trash { background-color: #ef4444; color: white; }

        .cost-input {
            width: 100px;
            text-align: right;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        @media (min-width: 768px) {
            .cost-input { padding: 6px 8px; font-size: 0.85rem; }
        }

        .code-cell {
            color: #2563eb; 
            font-weight: 700;
        }

        /* --- OTTIMIZZAZIONE PER LA STAMPA PDF --- */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body { 
                background-color: white !important; 
                padding: 0 !important; 
            }
            .no-print { 
                display: none !important; 
            }
            .table-container { 
                max-height: none !important; 
                overflow: visible !important; 
            }
            .max-w-7xl {
                max-width: 100% !important;
                width: 100% !important;
            }
            .bg-white {
                border: none !important;
                box-shadow: none !important;
            }
            /* Rende gli input simili a testo semplice in stampa */
            .cost-input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                width: auto !important;
            }
            /* Assicura che i colori dei badge vengano stampati */
            .badge {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Forza layout tabellare anche se si stampa da mobile */
            table { display: table !important; width: 100% !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { display: table-row !important; }
            td, th { display: table-cell !important; text-align: left !important; }
            .mobile-label { display: none !important; }
            td.flex { display: table-cell !important; }
        }
    </style>
</head>

                    onkeyup="applyFilters()">

        function formatCurrency(value) {
            return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(value);
        }

        function calculateTotals() {
            let totalVal = inventoryData.reduce((acc, item) => acc + item.costo, 0);
            document.getElementById('stat-total-value').innerText = formatCurrency(totalVal);
            document.getElementById('stat-total-items').innerText = inventoryData.length;
        }

        function updateItemCosto(index, newValue) {
            const val = parseFloat(newValue.replace(/\./g, '').replace(',', '.'));
            if (!isNaN(val)) {
                inventoryData[index].costo = val;
                calculateTotals();
            }
        }

        function updateItemStato(index, newState) {
            inventoryData[index].stato = newState;
            applyFilters();
        }

        function renderTable(data) {
            const body = document.getElementById('inventoryBody');
            body.innerHTML = '';
            
            data.forEach((item) => {
                const realIndex = inventoryData.findIndex(i => i.cd_ar === item.cd_ar);
                const row = document.createElement('tr');
                
                // Aggiornate le classi della riga per trasformarla in card su mobile
                row.className = 'block md:table-row bg-white hover:bg-slate-50 transition border border-slate-200 md:border-0 md:border-b mb-4 md:mb-0 rounded-xl md:rounded-none shadow-sm md:shadow-none p-2 md:p-0';
                
                let labelStato = 'Libero';
                let badgeClass = 'disponibile';
                if(item.stato === 'PRENOTATO') { labelStato = 'In Attesa'; badgeClass = 'prenotato'; }
                if(item.stato === 'VENDUTO') { labelStato = 'Venduto'; badgeClass = 'venduto'; }

                // Celle adattate per mostrare l'etichetta solo su mobile usando Flexbox
                row.innerHTML = `
                    <td class="flex justify-between items-center md:table-cell p-3 md:p-4 border-b border-slate-100 md:border-0 text-sm">
                        <span class="mobile-label md:hidden font-bold text-slate-400 uppercase text-[10px]">Codice</span>
                        <span class="code-cell">${item.cd_ar}</span>
                    </td>
                    <td class="flex flex-col md:table-cell p-3 md:p-4 border-b border-slate-100 md:border-0 text-sm text-slate-700 font-medium">
                        <span class="mobile-label md:hidden font-bold text-slate-400 uppercase text-[10px] mb-1">Descrizione</span>
                        <span class="text-right md:text-left">${item.ar_desc}</span>
                    </td>
                    <td class="flex justify-between items-center md:table-cell p-3 md:p-4 border-b border-slate-100 md:border-0 text-sm md:text-right">
                        <span class="mobile-label md:hidden font-bold text-slate-400 uppercase text-[10px]">Costo (€)</span>
                        <input type="text" class="cost-input focus:ring-2 focus:ring-blue-500 outline-none" 
                               value="${item.costo.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}" 
                               onchange="updateItemCosto(${realIndex}, this.value)">
                    </td>
                    <td class="flex justify-between items-center md:table-cell p-3 md:p-4 border-b border-slate-100 md:border-0 md:text-center">
                        <span class="mobile-label md:hidden font-bold text-slate-400 uppercase text-[10px]">Stato</span>
                        <span class="badge badge-${badgeClass}">${labelStato}</span>
                    </td>
                    <td class="flex justify-between items-center md:table-cell p-3 md:p-4 md:text-center no-print">
                        <span class="mobile-label md:hidden font-bold text-slate-400 uppercase text-[10px]">Azioni</span>
                        <div class="flex justify-end md:justify-center gap-2">
                            <button onclick="updateItemStato(${realIndex}, 'DISPONIBILE')" class="btn-action btn-check" title="Libero"><i class="fas fa-check text-xs md:text-[10px]"></i></button>
                            <button onclick="updateItemStato(${realIndex}, 'PRENOTATO')" class="btn-action btn-clock" title="In Attesa"><i class="fas fa-clock text-xs md:text-[10px]"></i></button>
                            <button onclick="updateItemStato(${realIndex}, 'VENDUTO')" class="btn-action btn-trash" title="Venduto"><i class="fas fa-shopping-cart text-xs md:text-[10px]"></i></button>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
            calculateTotals();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventoryData.filter(item => {
                return item.cd_ar.toLowerCase().includes(searchTerm) || 
                       item.ar_desc.toLowerCase().includes(searchTerm);
            });
            renderTable(filtered);
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(inventoryData.map(i => ({
                'Codice': i.cd_ar, 'Descrizione': i.ar_desc, 'Costo': i.costo, 'Stato': i.stato
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Magazzino");
            XLSX.writeFile(wb, "Magazzino_Usato.xlsx");
        }

        function exportToPDFTable() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            doc.text("Report Magazzino Strumenti USATO", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [["Codice", "Descrizione", "Costo", "Stato"]],
                body: inventoryData.map(i => [i.cd_ar, i.ar_desc, i.costo.toLocaleString('it-IT', {style: 'currency', currency: 'EUR'}), i.stato]),
                headStyles: { fillColor: [37, 99, 235] }
            });
            doc.save("Report_Tabellare.pdf");
        }

        window.onload = () => renderTable(inventoryData);
    </script>
</body>
</html>
